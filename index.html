<!DOCTYPE html>

<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#F8F4EA"
    >

    <title>مريم وحازم</title>

    <link
    rel="icon"
    type="image/png"
    href="assets/icons/favicon.png"
    >
    <!-- Allura  -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =====================================================
     ENVELOPE
     ===================================================== -->
<section id="envelope-screen">

    <div class="envelope-wrapper">

        <div class="envelope-image-wrapper">

            <img
                id="envelope-image"
                class="envelope-image"
                src=""
                alt="دعوة الزفاف"
            >

        </div>

        <button id="openInvitation"></button>

    </div>

</section>

<!-- =========================================
     FIXED INVITATION BACKGROUND
     ========================================= -->

<div
    id="invitation-background"
    aria-hidden="true"
></div>

<div
    id="invitation-background-overlay"
    aria-hidden="true"
></div>
<!-- =====================================================
     MAIN INVITATION
     ===================================================== -->

<main id="invitation">


    <!-- =================================================
         HERO
         ================================================= -->

    <section
        id="hero"
        class="section hero"
    >

        <div class="hero-content">

            <p
                id="hero-opening"
                class="small-title"
            ></p>


        <div class="hero-image-wrapper">
        
            <img id="hero-names-image" class="hero-names-image" src="" alt="Mariam and Hazem">
        
        </div>

            <p
                id="wedding-date"
                class="wedding-date"
            ></p>
                        <div class="ornament">
                ✦
            </div>

            <p
                id="welcome-message"
                class="large-text"
            ></p>

            <div class="scroll-indicator">
                ↓
            </div>

        </div>

    </section>

    <!-- =================================================
         WEDDING DETAILS
         ================================================= -->

    <section
        id="details-section"
        class="section"
    >

        <div class="content">

            <h2 id="details-title"></h2>


            <div class="gold-line"></div>


            <div class="wedding-details-visual">

    <!-- Calendar -->

    <div class="wedding-calendar">

        <div
            id="calendar-month"
            class="calendar-month"
        ></div>

        <div class="calendar-weekdays">

            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>

        </div>

        <div
            id="calendar-days"
            class="calendar-days"
        ></div>

    </div>


    <!-- Time -->

    <div class="wedding-time">
        <p
            id="wedding-time-text"
            class="time-value"
        ></p>

    </div>

</div>

        </div>

    </section>

<!-- =================================================
         LOCATION
         ================================================= -->

<section id="location-section" class="section">

    <div class="content">

        <h2 id="location-title"></h2>


        <div class="gold-line"></div>


        <p id="location-name"></p>


        <a id="location-button" class="gold-button" target="_blank" rel="noopener noreferrer"></a>

    </div>

</section>


    <!-- =================================================
         COUNTDOWN
         ================================================= -->

    <section
        id="countdown-section"
        class="section "
    >

        <div class="content">

            <h2 id="countdown-title"></h2>


            <div class="gold-line"></div>


            <div
                id="countdown"
                class="countdown"
            >


                <div>

                    <span id="days">
                        0
                    </span>

                    <small>
                       Days
                    </small>

                </div>


                <div>

                    <span id="hours">
                        0
                    </span>

                    <small>
                       Hours
                    </small>

                </div>


                <div>

                    <span id="minutes">
                        0
                    </span>

                    <small>
                       Minutes
                    </small>

                </div>


                <div>

                    <span id="seconds">
                        0
                    </span>

                    <small>
                       Seconds
                    </small>

                </div>


            </div>

        </div>

    </section>


    <!-- =================================================
         GALLERY
         ================================================= -->

    <section
        id="gallery-section"
        class="gallery-section"
    >

        <div class="content">

            <h2 id="gallery-title"></h2>


            <div class="gold-line"></div>


            <div
                id="gallery"
                class="gallery"
            ></div>
            <div class="gallery-closing">
            
                <div class="ornament">
                    ♡
                </div>
            
                <p id="closing-message"></p>
            
                <div class="gold-line closing-line"></div>
            
            </div>

        </div>

    </section>




    <!-- =================================================
         STORY
         ================================================= -->



    <!-- =================================================
         FINAL PAGE
         ================================================= -->

</main>



<!-- Config MUST load before main.js -->

<audio id="wedding-audio" preload="auto"></audio>

<script src="js/config.js"></script>

<script src="js/main.js"></script>


</body>

</html>
