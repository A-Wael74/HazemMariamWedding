<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#F8F4EA"
    >

    <title>مريم وحازم</title>

    <link
    rel="icon"
    type="image/png"
    href="assets/icons/favicon.png"
    >
    <!-- Aref Ruqaa -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =====================================================
     ENVELOPE
     ===================================================== -->

<section id="envelope-screen">

    <div class="envelope-wrapper">

        <div class="envelope">

            <div class="envelope-flap"></div>


            <div class="envelope-card">

                <p id="envelope-opening"></p>

                <h1>

                    <span id="envelope-bride"></span>

                    <span class="and">&</span>

                    <span id="envelope-groom"></span>

                </h1>

            </div>

        </div>


        <button id="openInvitation"></button>

    </div>

</section>



<!-- =====================================================
     MAIN INVITATION
     ===================================================== -->

<main id="invitation">


    <!-- =================================================
         HERO
         ================================================= -->

    <section
        id="hero"
        class="section hero blur-bg-section"
    >

        <div class="hero-content">

            <p
                id="hero-opening"
                class="small-title"
            ></p>


            <h1 class="couple-names">

                <span id="bride-name"></span>

                <span class="heart">
                    ♡
                </span>

                <span id="groom-name"></span>

            </h1>


            <p
                id="wedding-date"
                class="wedding-date"
            ></p>


            <div class="scroll-indicator">
                ↓
            </div>

        </div>

    </section>



    <!-- =================================================
         WELCOME
         ================================================= -->

    <section
        id="welcome-section"
        class="section blur-bg-section"
    >

        <div class="content">

            <div class="ornament">
                ✦
            </div>


            <h2 id="welcome-title"></h2>


            <div class="gold-line"></div>


            <p
                id="welcome-message"
                class="large-text"
            ></p>

        </div>

    </section>



    <!-- =================================================
         STORY
         ================================================= -->

    <section
        id="story-section"
        class="section blur-bg-section"
    >

        <div class="content">

            <h2 id="story-title"></h2>


            <div class="gold-line"></div>


            <p id="story-text"></p>

        </div>

    </section>



    <!-- =================================================
         WEDDING DETAILS
         ================================================= -->

    <section
        id="details-section"
        class="section blur-bg-section"
    >

        <div class="content">

            <h2 id="details-title"></h2>


            <div class="gold-line"></div>


            <div class="details">


                <div class="detail-card">

                    <span class="detail-icon">
                        ◇
                    </span>

                    <h3>
                        التاريخ
                    </h3>

                    <p id="detail-date"></p>

                </div>


                <div class="detail-card">

                    <span class="detail-icon">
                        ◷
                    </span>

                    <h3>
                        الوقت
                    </h3>

                    <p id="detail-time"></p>

                </div>


                <div class="detail-card">

                    <span class="detail-icon">
                        ♧
                    </span>

                    <h3>
                        المكان
                    </h3>

                    <p id="detail-venue"></p>

                </div>


            </div>

        </div>

    </section>



    <!-- =================================================
         COUNTDOWN
         ================================================= -->

    <section
        id="countdown-section"
        class="section blur-bg-section"
    >

        <div class="content">

            <h2 id="countdown-title"></h2>


            <div class="gold-line"></div>


            <div
                id="countdown"
                class="countdown"
            >


                <div>

                    <span id="days">
                        0
                    </span>

                    <small>
                        يوم
                    </small>

                </div>


                <div>

                    <span id="hours">
                        0
                    </span>

                    <small>
                        ساعة
                    </small>

                </div>


                <div>

                    <span id="minutes">
                        0
                    </span>

                    <small>
                        دقيقة
                    </small>

                </div>


                <div>

                    <span id="seconds">
                        0
                    </span>

                    <small>
                        ثانية
                    </small>

                </div>


            </div>

        </div>

    </section>



    <!-- =================================================
         GALLERY
         ================================================= -->

    <section
        id="gallery-section"
        class="gallery-section blur-bg-section"
    >

        <div class="content">

            <h2 id="gallery-title"></h2>


            <div class="gold-line"></div>


            <div
                id="gallery"
                class="gallery"
            ></div>

        </div>

    </section>



    <!-- =================================================
         LOCATION
         ================================================= -->

    <section
        id="location-section"
        class="section blur-bg-section"
    >

        <div class="content">

            <h2 id="location-title"></h2>


            <div class="gold-line"></div>


            <p id="location-name"></p>


            <a
                id="location-button"
                class="gold-button"
                target="_blank"
                rel="noopener noreferrer"
            ></a>

        </div>

    </section>



    <!-- =================================================
         FINAL PAGE
         ================================================= -->

    <section
        id="closing-section"
        class="section closing blur-bg-section"
    >

        <div class="content">

            <div class="ornament">
                ♡
            </div>


            <h2>

                <span id="closing-bride"></span>

                <span class="and">
                    &
                </span>

                <span id="closing-groom"></span>

            </h2>


            <div class="gold-line"></div>


            <p id="closing-message"></p>

        </div>

    </section>


</main>



<!-- Config MUST load before main.js -->

<script src="js/config.js"></script>

<script src="js/main.js"></script>


</body>

</html>
